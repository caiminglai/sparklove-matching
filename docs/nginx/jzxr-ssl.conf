server {
    listen 443 ssl;
    server_name sparklove.cn www.sparklove.cn;

    ssl_certificate /etc/letsencrypt/live/sparklove.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sparklove.cn/privkey.pem;

    location / {
        root /var/www/jzxr/app/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /admin/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        alias /var/www/jzxr/uploads/;
    }
}

server {
    listen 80;
    server_name sparklove.cn www.sparklove.cn;
    return 301 https://$server_name$request_uri;
}
