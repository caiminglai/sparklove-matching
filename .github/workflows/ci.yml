name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 Dockerfile 的运行时对齐（node:24-slim），CI 测一个线上不用的版本没意义
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

      # 暂不挂 format:check：实测 npm run format:check 有 49 个文件不合规，挂上就是常驻红灯。
      # 想收口时单独跑一次 npm run format 再取消这两行的注释。
